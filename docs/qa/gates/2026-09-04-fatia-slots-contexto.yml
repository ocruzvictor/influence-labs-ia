# 2. FINDINGS
# ---------------------------------------------------------------------------
top_issues:
  - id: 'COMPAT-01'
    severity: medium
    finding: >
      Overlay 9800 alinha o guard e o catálogo à agenda local, mas a API Trinks
      ainda valida a matriz oficial. CREATE Gi×Design pode passar isCompatible e
      tomar 400 no POST
    evidence: >
      isCompatible OR appointments (trinks-local-store.js:134-155). createBookingInTrinks
      POST /agendamentos intacto (server.js:1034). SOT: 129 pares Gi+Design na agenda,
      matriz só Descoloração. Não há prova de booking no profissional errado — o par
      oferecido é o observado. getServiceForProfessional (server.js:672+) ainda filtra
      só listCompatibility; caminho v2 com servicoId não usa esse lookup.
    impact: >
      Cliente pode ouvir oferta honesta da Gi, o guard deixa passar, e o outbox
      reporta falha se a Trinks recusar. Melhor que "Giovanna não realiza" contra
      a agenda real. Não grava o profissional errado.
    suggested_action: >
      Publicar assim. Observar booking.failed / 400 Trinks no par overlay após ACK.
      Não sincronizar matriz nesta fatia. Não POST Trinks "para testar".
    blocks_publish: false

  - id: 'QUAL-02'
    severity: low
    finding: >
      isColloquialPenteado exige a substring "penteado"; o last4 3653 usou "pentado"
    evidence: >
      booking-parser.js:539 — if (!norm.includes('penteado')) return false.
      Análise Orion: único fio pós-OPEN com pentado+vídeo+insta.
    impact: >
      Typo "pentado para o dia a dia" não dispara corte+DISAMBIGUA nesta fala.
      Se a mesma fala tiver "corte"/"tesoura"/"insta" sem "penteado", o filtro
      1b ainda pega corte pelo keyword list — sem DISAMBIGUA.
    suggested_action: >
      Aceitar neste corte (SOT escreveu "penteado"). Sinónimo pentado = fatia futura,
      sem paste 46589.
    blocks_publish: false

  - id: 'TEST-01'
    severity: low
    finding: >
      Sem teste unitário de hasSlotSnapshotForDate com maxAgeHours fracionário (0.75h);
      o caso festa não chama filterServicesByKeywords, só isColloquialPenteado
    evidence: >
      trinks-local-store.test.js não referencia hasSlotSnapshotForDate.
      booking-parser.test.js:299-305 — festa só no boolean; o filter testado é o dia a dia.
      Assembler mocka ensureSlotSnapshot — não exercita o SQL de idade.
    impact: >
      Regressão do 0.75h (PG recusar intervalo) só apareceria no container (W5 Gage).
    suggested_action: >
      Opcional na próxima fatia. W5: confirmar no container que hasSlotSnapshotForDate
      com 0.75h cobre snapshot <45 min e relê ≥45 min.
    blocks_publish: false

