top_issues:
  - id: 'REQ-01'
    severity: medium
    finding: >
      detectGenderQualifier não é last-wins (Aria §2.1). Percorre todos os
      masculino e depois todos os feminino — se os dois tokens existem no
      blob, o retorno é sempre feminino.
    evidence: >
      booking-parser.js:566-576. Probe: "É feminino, quero masculino" → feminino;
      "Masculino depois feminino" → feminino.
    impact: >
      Sessão quente 4749 (turno "Masculino" sozinho) está correta — sticky
      grava na primeira detecção. Cold start / evict que concatena history
      com "Corte Feminino" no turno assistant pode rehidratar feminino mesmo
      com "Masculino" do cliente no slice. Amplifica residual Aria §9.5.
    suggested_action: >
      Dex: um loop em ordem de documento (último \\bmasculino\\b / \\bfeminino\\b
      ganha). Sem migration. Sem religar. Não é FAIL — 4749 no happy-path
      in-memory passa.
    blocks_publish: false

  - id: 'TEST-01'
    severity: low
    finding: >
      I3 afirma signal ≠ unknown, não intent !== UNCERTAIN. Implementação
      cai em SCHEDULING via hasProfessionalSignal — dente ok, assert frouxo.
    evidence: 'tess-context-intent.test.js I3; classifyTessIntent :316-318.'
