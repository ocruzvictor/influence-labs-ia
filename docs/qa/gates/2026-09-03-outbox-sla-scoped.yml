top_issues:
  - id: 'SLA-01'
    severity: high
    finding: 'computeHandoffSlaAt devolve SLA fora do horário comercial na janela sáb-18h → seg-09h'
    evidence: 'backend/lib/handoff-sla.js:17-24 — loop de 96 iterações × 15 min = 24h de lookahead. Dom(0) e Seg(1) são fechados (backend/lib/salon-dates.js:139-140), então de sáb-18h a ter-09h são ~63h > 24h; o loop esgota e cai no fallback da linha 24 (now + 15 min), dentro de horário fechado.'
    reproduction: |
      node -e "require('./backend/lib/handoff-sla').computeHandoffSlaAt(new Date('2026-08-16T15:00:00-03:00'))"
      Medido:  Dom 15:00 → SLA Dom 15:15 (FECHADO)   [esperado: Ter 09:15]
               Sáb 18:30 → SLA Sáb 18:45 (FECHADO)   [esperado: Ter 09:15]
               Dom 09:00 → SLA Dom 09:15 (FECHADO)   [esperado: Ter 09:15]
               Seg 12:00 → SLA Ter 09:15 (ok, 21h < 24h)
               Sex 19:30 → SLA Sáb 09:15 (ok)
    impact: >
      Handoff no fim de semana nasce com SLA já vencido → listar_handoff_sla marca breached=true
      imediatamente e realertar_handoff_sla emite handoff.sla_breach repetidamente.
      Alert-fatigue justamente no guarda-corpo criado para proteger o tempo de resposta.
      Blast radius ~39h/semana (~23%). Interno ao Tiago; NUNCA atinge a cliente.
    suggested_action: 'Elevar o lookahead para ≥288 iterações (72h) ou caminhar dia-a-dia até o próximo dia aberto. Adicionar asserção isSalonOpen(sla).open === true.'
    blocks_publish: true

  - id: 'ENV-01'
    severity: high
    finding: 'Invariante "Skip trivial OFF" não vale no processo live, e o rito de publish não verifica a variável'
    evidence: 'docs/ops/smoke-tess-context-scoped-whitelist-2026-09-01.md:15,53,97 e docs/stories/salon-whatsapp-tess-context-on-demand.md:134 — prod roda skip_trivial=true desde 2026-09-01. Handoff §Gate Quinn linha 64 afirma OFF. O checklist de confirmação do handoff (passo 5) checa TESS_CONTEXT_MODE, BOT_ACCEPT_ALL e allowlist, mas NÃO checa TESS_SKIP_TRIVIAL.'
    impact: >
      Duas rotas, ambas com flip silencioso de comportamento:
      (a) publicando o compose, ${TESS_SKIP_TRIVIAL:-false} resolve pelo infra/.env do VPS (=true)
          → skip trivial permanece LIGADO, contrariando o invariante declarado do gate;
      (b) resetando sem publicar o compose, o passthrough desaparece → cai no default de código
          (false) → skip trivial DESLIGA silenciosamente em prod.
      Nenhuma das duas foi planejada explicitamente.
    suggested_action: 'Victor decide o valor-alvo de TESS_SKIP_TRIVIAL em prod; Gage captura `docker exec backend env | grep TESS_` ANTES do reset e adiciona TESS_SKIP_TRIVIAL ao passo 5 do rito.'
    blocks_publish: true

  - id: 'ENV-02'
    severity: high
    finding: 'Passthrough de env existe no VPS mas não em HEAD; o `git reset` do rito pode clobberar e deixar o rollback documentado inoperante'
    evidence: 'git show HEAD:infra/docker-compose.yml | grep TESS_CONTEXT → NENHUM resultado. O serviço backend usa bloco `environment:` explícito e NÃO tem `env_file:` (grep env_file infra/docker-compose.yml → vazio); backend/server.js não carrega dotenv. Porém docs/ops/smoke-tess-context-scoped-whitelist-2026-09-01.md:97 afirma que as vars estão "no processo backend (variáveis de container via docker-compose.yml)" → o compose do VPS tem edição local NÃO COMMITADA.'
    impact: >
      O passo 3 do rito (`git fetch` + reset no worktree) reverte infra/docker-compose.yml para HEAD,
      que não tem passthrough algum. Sem TESS_CONTEXT_MODE nem TESS_CONTEXT_FORCE_FULL chegando ao
      container, o rollback do passo 6 ("TESS_CONTEXT_MODE=full" ou "TESS_CONTEXT_FORCE_FULL=1")
      NÃO FUNCIONA — a única saída passa a ser reverter código + rebuild.
      Corolário: a afirmação do handoff "Se o VPS já define a env, o fallback do compose não muda o
      processo" é enganosa, porque sem o passthrough o valor do infra/.env não alcança o processo.
    suggested_action: 'Publicar infra/docker-compose.yml (linhas de passthrough) NO MESMO rebuild que backend/lib/tess-context-config.js — atômico. Antes do reset, Gage faz backup do compose do VPS e diffa contra o local.'
    blocks_publish: true

  - id: 'SCOPE-01'
    severity: medium
    finding: 'backend/lib/tess-context-assembler.js alterado sem estar na allowlist — mudança de hot-path visível à cliente'
    evidence: 'git diff --stat mostra backend/lib/tess-context-assembler.js | 3 +- (adiciona `durationMin: resolveOfferDurationMin(svcPayload.data)` na construção do bloco de slots) e backend/test/tess-context-assembler.test.js | 74 ++++. Nenhum dos dois consta em docs/handoffs/2026-09-03-orion-proxima-fatia-outbox-sla-scoped.md.'
    impact: >
      Altera o cálculo de duração da oferta de horários — comportamento de agendamento visível à
      cliente — dentro de um pacote cujo objetivo declarado é escopo estreito.
      SEM risco de crash: resolveOfferDurationMin é exportado (backend/lib/tess-context-slots.js:442)
      e tess-context-slots.js está limpo/commitado.
    suggested_action: 'Incluir os dois arquivos na allowlist com justificativa explícita, ou deixá-los fora do commit. Não publicar mudança de oferta não declarada.'
    blocks_publish: true

  - id: 'SCOPE-02'
    severity: medium
    finding: 'infra/nginx/default.conf tem 43 linhas alteradas, embora o handoff diga "sem nginx" — e o rito manda dar reload'
    evidence: 'git diff infra/nginx/default.conf: (a) remove upstreams n8n_upstream/chatwoot_upstream e transforma os vhosts em `return 503` (containers pausados por limite de CPU Hostinger); (b) adiciona `location /mcp` proxy para backend_upstream com passthrough de Authorization. Handoff linha 17 exclui nginx; passo 4 do rito pede "Nginx reload".'
    impact: >
      (a) é PROTETIVO: com os upstreams antigos presentes e os hosts irresolvíveis, `nginx -t`/reload
      falha e derruba api.studiotirra.com.br junto. Sanidade offline: chaves balanceadas, zero
      referência remanescente aos upstreams pausados.
      (b) expõe /mcp publicamente. NÃO é brecha: requireNightwatchAuth falha fechado
      (backend/lib/nightwatch-mcp.js:189-198 → 503 nightwatch_mcp_unconfigured quando sem token)
      e compara com timingSafeEqual. Ainda assim é superfície pública nova, não declarada.
    suggested_action: 'Decidir explicitamente: publicar nginx (aceitando /mcp exposto + 503 em n8n/chatwoot) OU manter fora e NÃO dar reload. Se publicar, rodar `nginx -t` antes do reload.'
    blocks_publish: true

  - id: 'OBX-01'
    severity: medium
    finding: 'A copy honesta morre em silêncio quando emitEvent falha — falha correlacionada'
    evidence: 'backend/lib/outbound-outbox.js:23-42 — `fired = true` (linha 24) e `await emitEvent(...)` (26-32) acontecem ANTES de sendFn (34-35). Se emitEvent rejeita (Postgres fora), o envio nunca roda e fired=true bloqueia qualquer retry.'
    impact: >
      O outbox existe exatamente para cenários de falha, que frequentemente coincidem com problema
      de DB/infra — ou seja, o caso de maior necessidade é o que silenciosamente não faz nada,
      devolvendo a cliente ao silêncio que a fatia queria eliminar.
      NÃO derruba o processo: withTimeout captura (backend/server.js:2248-2257) e o
      res.json({ok:true}) já saiu em server.js:2676, logo não há unhandled rejection.
    suggested_action: 'Envolver emitEvent em try/catch próprio, ou enviar primeiro e emitir depois.'
    blocks_publish: false

  - id: 'OBX-02'
    severity: low
    finding: 'Armadilha latente de falso-positivo I1: OUTBOX_COPY casa com o detector de sucesso de produção'
    evidence: 'backend/lib/nightwatch-ops.js:27 — SUCCESS_COPY_RE inclui o token `cancelei`. OUTBOX_COPY contém "Não gravei nem cancelei nada" → regex casa (verificado: token capturado ["cancelei"]). classifyVerify (backend/lib/nightwatch-ops.js:302-304) devolveria FAIL/I1 "sucesso no WhatsApp sem booking/mutation 2xx".'
    impact: >
      HOJE INATIVO: a copy nunca é persistida em conversation_history (backend/lib/outbound-outbox.js
      não chama saveConversationTurns; backend/server.js:2407-2427 sendKapsoMessage não persiste) e
      verifyCommit ignora assistantText externo de propósito, lendo só a thread do banco
      (backend/lib/nightwatch-ops.js:334-344; teste em backend/test/nightwatch-ops.test.js:329).
      Vira falso FAIL/I1 no instante em que alguém persistir a copy — que é justamente o conserto
      natural de OBX-03.
      O teste da fatia não pega isso: backend/test/outbound-outbox.test.js:7 usa regex ad-hoc mais
      fraca em vez de importar SUCCESS_COPY_RE.
    suggested_action: 'Fazer o teste importar SUCCESS_COPY_RE de nightwatch-ops e trocar o token, ex.: "Não registrei nenhuma alteração na sua agenda." Corrigir junto com OBX-03.'
    blocks_publish: false

  - id: 'OBX-03'
    severity: low
    finding: 'A copy do outbox não entra no histórico da conversa — incoerência de thread, amplificada por scoped'
    evidence: 'backend/lib/outbound-outbox.js — zero ocorrências de saveConversationTurns; envio direto por sendFn=sendKapsoMessage (backend/server.js:2688).'
    impact: 'A cliente recebe uma mensagem que o bot não tem registro. No turno seguinte, sobretudo em `scoped` (menos histórico), a Tess pode se contradizer.'
    suggested_action: 'Persistir a copy com agent=''outbox'' — e nesse momento OBX-02 precisa já estar corrigido.'
    blocks_publish: false

  - id: 'TEST-01'
    severity: medium
    finding: 'Teste "closed Sunday waits until Tuesday open + 15 min" passa sem verificar o que o nome afirma'
    evidence: 'backend/test/handoff-sla.test.js:18-27 — asserta apenas sla > now e new Date(payload.sla_at).getUTCHours() >= 12. Com o resultado bugado Dom 15:15 (-03:00 → 18:15 UTC), 18 >= 12 → PASSA.'
    impact: 'SLA-01 embarca verde. Falsa confiança exatamente no comportamento de fim de semana.'
    suggested_action: 'Assertar isSalonOpen(sla).open === true e o weekday/hora esperados (Ter 09:15).'
    blocks_publish: false

  - id: 'SCOPE-03'
    severity: low
    finding: 'AC15 da story ainda declara default `full`; override só existe em docs operacionais'
    evidence: 'docs/stories/salon-whatsapp-tess-context-on-demand.md:81 (AC15) e :96 (tabela) dizem default `full`. Override registrado em docs/analysis/2026-09-03-orion-decisoes-execucao.md:15, backend/lib/tess-context-config.js:2-3 e infra/.env.example:59-61 — mas sem nota de emenda na story.'
    impact: 'Revisor futuro pode tratar `scoped` como regressão de AC15.'
    suggested_action: 'Uma linha de emenda na story apontando para o handoff/decisão de 2026-09-03. (@pm/@po se quiserem story formal.)'
    blocks_publish: false

