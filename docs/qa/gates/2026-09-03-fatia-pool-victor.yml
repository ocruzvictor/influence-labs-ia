top_issues:
  - id: 'QUAL-01'
    severity: medium
    finding: >
      UNCERTAIN → MIN corta grade e catálogo; Tess ainda fala, mas frases compostas
      (preço+data) perdem insumos Trinks e podem ficar genéricas
    evidence: >
      classifyTessIntent("quanto custa amanhã") / "quanto custa e tem sábado?" →
      UNCERTAIN (tess-context-intent.test.js:30-32; assembler.test.js:196-206).
      MIN zera fetchSlots/fetchCatalog. shouldSkipTess não se aplica. Sem smoke
      WhatsApp neste gate (trava do pacote).
    impact: >
      Cliente pode receber pergunta de desambiguação sem preço nem horário live.
      É o corte autorizado do item 6 (crédito). NÃO é silêncio robótico.
    suggested_action: >
      Observar tess.turn UNCERTAIN:MIN em live após ACK. Não voltar UNCERTAIN
      para FULL. Hard cap de chars (item 7) continua fora.
    blocks_publish: false

  - id: 'SLOT-01'
    severity: low
    finding: 'durationMin usa o máximo das durações quando há 2–3 SKUs no payload filtrado'
    evidence: 'backend/lib/tess-context-slots.js:197-203 — Math.max(...durs) se length ≤ 3.'
    impact: >
      Combo curto+longo (ex. corte 30 + maquiagem 120) esconde inícios que
      caberiam só no curto. Conservador; o guard de confirmação continua.
    suggested_action: 'Aceitar. Se doer, filtrar pela duração do SKU escolhido — fatia futura.'
    blocks_publish: false

  - id: 'OBS-01'
    severity: low
    finding: 'logTessTurnTelemetry (stdout) não leva confidence nem trace_id'
    evidence: 'backend/lib/tess-context-assembler.js:293-310 — payload de console tem intent/profile/credits, sem confidence/trace_id. persistTessTurnEvent no DB tem os dois.'
    impact: 'grep de log de container fica cego no cruzamento; a CLI/DB não.'
    suggested_action: 'Opcional: espelhar confidence e trace_id no JSON de stdout.'
    blocks_publish: false

