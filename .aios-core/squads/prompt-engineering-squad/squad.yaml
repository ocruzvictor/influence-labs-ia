squad:
  id: prompt-engineering-squad
  name: "Prompt Engineering Squad"
  version: "0.1.0"
  created: "2026-05-25"
  created_by: "@pedro-valerio (structure-pipeline FASE 3)"
  purpose: |
    Codifica o processo de engenharia de prompt no desenvolvimento de agentes
    conversacionais (Tipo 4). Substitui o processo ad-hoc da Revisão 0 por um
    fluxo gateado, com owners segregados e biblioteca de anatomias indexada
    por tipo de objetivo.

  scope:
    covers:
      - "Agentes Tipo 4 — autônomo conversacional (SDR, atendimento, etc.)"
      - "Multi-agente intra-projeto (ex: Router + Atendimento + Avaliador)"
      - "Reutilização cross-scope (novos clientes/negócios) via parâmetro de briefing"
    deferred:
      - "Tipo 2 — agente acionado por evento"
      - "Tipo 5 — agente multimodelo"

  design_doc: "docs/analysis/eng-map-prompt-engineering.md"
  insumos: "docs/analysis/insumos-ready-prompt-engineering.md"

  agents:
    - id: prompt-briefer
      file: "agents/prompt-briefer.md"
      role: "Briefing + curadoria de fontes"
      etapas: [1, 3]

    - id: prompt-methodology-curator
      file: "agents/prompt-methodology-curator.md"
      role: "Seleção de anatomia + curadoria contínua da biblioteca"
      etapas: [2]
      continuous_mandate: true

    - id: prompt-writer
      file: "agents/prompt-writer.md"
      role: "Redação e correção do prompt na anatomia selecionada"
      etapas: [4, 8]

    - id: prompt-evaluator
      file: "agents/prompt-evaluator.md"
      role: "Quality gate + eval + diagnóstico de falhas"
      etapas: [5, 6, 7]

    - id: prompt-release-manager
      file: "agents/prompt-release-manager.md"
      role: "Versionamento + deploy registrado"
      etapas: [10]

  human_gate:
    role: "Aprovador Humano"
    etapas: [9]
    note: "Gate de accountability indelegável. Hoje: Victor."

  workflow: "workflows/prompt-engineering-pipeline.yaml"

  shared_resources:
    voice_dna: "data/voice-dna-squad.md"
    biblioteca_anatomias: "data/biblioteca-anatomias.md"
    quality_gate_checklist: "checklists/prompt-quality-gate.md"

  handoffs:
    - to: "@dev"
      artifact: "handoffs/D8-harness-scope-generalizacao.md"
      purpose: "Generalizar harness sdr-eval para scope-parametrizado"

  quality_target:
    agents_min_lines: 300       # blocking (structure-pipeline veto)
    agents_recommended_lines: 800 # tech debt declarado em v0.1.0
    tech_debt:
      - "Expandir agentes para 800+ linhas (agent-quality-gate v4.0 recommended)"
      - "Plugar eval no CI (gap G4 — out of FASE 3 scope inicial)"
