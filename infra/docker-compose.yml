services:
  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG:-2.7.4}
    container_name: n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: n8n.${BASE_DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${BASE_DOMAIN}/
      GENERIC_TIMEZONE: America/Sao_Paulo
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      TRINKS_API_BASE_URL: ${TRINKS_API_BASE_URL}
      TRINKS_API_KEY: ${TRINKS_API_KEY}
      TRINKS_SALON_ID: ${TRINKS_SALON_ID}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID}
      CHATWOOT_INBOX_ID: ${CHATWOOT_INBOX_ID}
      CHATWOOT_INBOX_IDENTIFIER: ${CHATWOOT_INBOX_IDENTIFIER}
      CHATWOOT_ASSIGNEE_ID: ${CHATWOOT_ASSIGNEE_ID}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      RAG_INDEX_PATH: ${RAG_INDEX_PATH}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
      TESS_API_TOKEN: ${TESS_API_TOKEN}
      TESS_AGENT_ID: ${TESS_AGENT_ID:-46589}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../data/rag:/data/rag:ro
    depends_on:
      postgres:
        condition: service_healthy

  chatwoot:
    image: chatwoot/chatwoot:${CHATWOOT_IMAGE_TAG:-v4.10.1}
    container_name: chatwoot
    restart: unless-stopped
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${CHATWOOT_SECRET}
      FRONTEND_URL: https://chat.${BASE_DOMAIN}
      ENABLE_ACCOUNT_SIGNUP: "false"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/chatwoot
      REDIS_URL: redis://redis:6379/1
      RAILS_LOG_TO_STDOUT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatwoot-worker:
    image: chatwoot/chatwoot:${CHATWOOT_IMAGE_TAG:-v4.10.1}
    container_name: chatwoot-worker
    restart: unless-stopped
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${CHATWOOT_SECRET}
      FRONTEND_URL: https://chat.${BASE_DOMAIN}
      ENABLE_ACCOUNT_SIGNUP: "false"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/chatwoot
      REDIS_URL: redis://redis:6379/1
      RAILS_LOG_TO_STDOUT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      TESS_API_BASE: ${TESS_API_BASE:-https://api.tess.im}
      TESS_API_TOKEN: ${TESS_API_TOKEN}
      TESS_AGENT_ID: ${TESS_AGENT_ID:-46589}
      TESS_API_URL: ${TESS_API_URL:-}
      TIAGO_NOTIFICATION_PHONE: ${TIAGO_NOTIFICATION_PHONE:-}
      SUPERVISOR_AGENT_ID: ${SUPERVISOR_AGENT_ID:-46590}
      SUPERVISOR_TOP_N: ${SUPERVISOR_TOP_N:-10}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TESS_TRANSCRIPTION_AGENT_ID: ${TESS_TRANSCRIPTION_AGENT_ID:-}
      TRINKS_API_BASE: ${TRINKS_API_BASE:-https://api.trinks.com/v1}
      TRINKS_API_KEY: ${TRINKS_API_KEY}
      TRINKS_ESTABELECIMENTO_ID: ${TRINKS_ESTABELECIMENTO_ID:-243868}
      KAPSO_WEBHOOK_SECRET: ${KAPSO_WEBHOOK_SECRET}
      KAPSO_API_KEY: ${KAPSO_API_KEY}
      KAPSO_API_BASE: ${KAPSO_API_BASE:-https://api.kapso.ai}
      KAPSO_API_VERSION: ${KAPSO_API_VERSION:-v24.0}
      BOT_ALLOWED_PHONES: ${BOT_ALLOWED_PHONES}
      BOT_ACCEPT_ALL: ${BOT_ACCEPT_ALL:-false}
      HUMAN_HANDLED_TTL_HOURS: ${HUMAN_HANDLED_TTL_HOURS:-6}
      TESS_AGENT_SUPERVISOR_ID: ${TESS_AGENT_SUPERVISOR_ID}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-studio-tirra-verify-2026}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/influence_labs_salon
    depends_on:
      postgres:
        condition: service_healthy
    # Sem ports: acesso apenas via nginx (api.studiotirra.com.br)

  # Admin Dashboard (Story 1.1+) — criado por @devops para EPIC-studio-tirra-admin-dashboard.
  # Next.js 15 standalone. Build context: ../frontend/admin (criado pela Story 1.1 @dev).
  admin-frontend:
    build:
      context: ../frontend/admin
      dockerfile: Dockerfile
    container_name: admin-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/influence_labs_salon
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-auth@studiotirra.com.br}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-https://admin.studiotirra.com.br}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3001}
      BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    # Sem ports: acesso apenas via nginx (admin.studiotirra.com.br → admin-frontend:3002)

  # Trinks sync worker (cron 15min) — isolado do admin-frontend pra UI nao cair em crash do sync.
  admin-trinks-sync:
    build:
      context: ../frontend/admin
      dockerfile: Dockerfile
    container_name: admin-trinks-sync
    restart: unless-stopped
    command: ["node", "dist/lib/trinks-sync-worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/influence_labs_salon
      TRINKS_API_BASE: ${TRINKS_API_BASE:-https://api.trinks.com/v1}
      TRINKS_API_KEY: ${TRINKS_API_KEY}
      TRINKS_ESTABELECIMENTO_ID: ${TRINKS_ESTABELECIMENTO_ID:-243868}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount default.conf (n8n/chatwoot/api) + diretório conf.d/ (admin.conf e futuros).
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/admin.conf:/etc/nginx/conf.d/admin.conf:ro
      - certbot_webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - chatwoot
      - n8n
      - backend
      - admin-frontend

  # Servico certbot removido — loop quebrado (mount mismatch: certbot_certs vs host /etc/letsencrypt).
  # Renovacao agora roda via cron de host: infra/scripts/renew-certs.sh.
  # Volume infra_certbot_webroot continua existindo (nginx serve /.well-known/acme-challenge/ dele).

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7.4.7-alpine}
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  n8n_data:
  postgres_data:
  redis_data:
  certbot_webroot:
  certbot_certs:
