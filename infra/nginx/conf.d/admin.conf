# Studio Tirra Admin Dashboard — nginx server blocks
# Criado por @devops (Gage) para Story 1.1 (admin-dashboard-story-1.1-auth-scaffold).
# Referência: docs/architecture/admin-dashboard.md §14.2
#
# NOTA DE MOUNT: o docker-compose atual monta apenas ./nginx/default.conf
# (single file). Para ativar este arquivo no container nginx é necessário
# trocar o mount por uma diretoria (./nginx/conf.d:/etc/nginx/conf.d:ro)
# ou adicionar um mount extra deste arquivo. Ver runbook docs/ops/admin-dashboard-deploy.md.

# Rate limit zones (devem ficar fora dos server blocks).
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=admin_auth_limit:10m rate=5r/m;

upstream admin_frontend_upstream {
  server admin-frontend:3002;
}

# HTTP → HTTPS redirect + ACME challenge.
server {
  listen 80;
  server_name admin.studiotirra.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server.
server {
  listen 443 ssl http2;
  server_name admin.studiotirra.com.br;

  ssl_certificate     /etc/letsencrypt/live/admin.studiotirra.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.studiotirra.com.br/privkey.pem;

  # Rate limit global: 60 req/min/IP (burst 20).
  limit_req zone=admin_limit burst=20 nodelay;

  # Rate limit estrito em /api/auth/* (anti magic-link abuse): 5 req/min/IP (burst 3).
  location /api/auth/ {
    limit_req zone=admin_auth_limit burst=3 nodelay;

    proxy_pass http://admin_frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://admin_frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
    proxy_connect_timeout 10s;
  }
}
