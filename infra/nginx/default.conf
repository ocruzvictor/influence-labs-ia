map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream evolution_upstream {
  server evolution-api:8080;
}

upstream n8n_upstream {
  server n8n:5678;
}

upstream chatwoot_upstream {
  server chatwoot:3000;
}

upstream typebot_upstream {
  server typebot-viewer:3000;
}

server {
  listen 80;
  server_name api.seudominio.com.br n8n.seudominio.com.br chat.seudominio.com.br bot.seudominio.com.br;
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name api.seudominio.com.br;

  ssl_certificate /etc/letsencrypt/live/api.seudominio.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.seudominio.com.br/privkey.pem;

  location / {
    proxy_pass http://evolution_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name n8n.seudominio.com.br;

  ssl_certificate /etc/letsencrypt/live/n8n.seudominio.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/n8n.seudominio.com.br/privkey.pem;

  location / {
    proxy_pass http://n8n_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name chat.seudominio.com.br;

  ssl_certificate /etc/letsencrypt/live/chat.seudominio.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chat.seudominio.com.br/privkey.pem;

  location / {
    proxy_pass http://chatwoot_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name bot.seudominio.com.br;

  ssl_certificate /etc/letsencrypt/live/bot.seudominio.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bot.seudominio.com.br/privkey.pem;

  location / {
    proxy_pass http://typebot_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
