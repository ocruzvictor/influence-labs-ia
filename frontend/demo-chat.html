<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Studio Tirra — Assistente Virtual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1A1A2E;
      --terracotta: #D4622B;
      --beige: #F5F3EE;
      --white: #FFFFFF;
      --gray-100: #F7F7F7;
      --gray-300: #D1D5DB;
      --gray-500: #6B7280;
      --gray-800: #1F2937;
      --green-500: #22C55E;
      --radius: 16px;
      --font-heading: 'DM Sans', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--gray-100);
    }

    /* ====== LAYOUT ====== */
    .chat-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: var(--white);
      box-shadow: 0 0 40px rgba(26, 26, 46, 0.08);
    }

    /* ====== HEADER ====== */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--navy);
      color: var(--white);
      flex-shrink: 0;
    }

    .chat-header-info { flex: 1; }

    .btn-reset {
      background: none;
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.8);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-reset:hover { border-color: var(--terracotta); color: var(--white); }

    .chat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--terracotta);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 16px;
      color: var(--white);
      flex-shrink: 0;
    }

    .chat-header-info h1 {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
    }

    .chat-header-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-500);
    }

    /* ====== MESSAGES ====== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--beige);
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
      position: relative;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-received {
      align-self: flex-start;
      background: var(--white);
      color: var(--gray-800);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .msg-sent {
      align-self: flex-end;
      background: var(--navy);
      color: var(--white);
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      display: block;
      font-size: 11px;
      margin-top: 4px;
      opacity: 0.5;
      text-align: right;
    }

    /* ====== TYPING INDICATOR ====== */
    .typing-indicator {
      align-self: flex-start;
      display: none;
      gap: 5px;
      padding: 12px 18px;
      background: var(--white);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .typing-indicator.active { display: flex; }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gray-300);
      animation: typingBounce 1.4s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); background: var(--gray-300); }
      30% { transform: translateY(-6px); background: var(--terracotta); }
    }

    /* ====== INPUT BAR ====== */
    .chat-input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid rgba(0,0,0,0.06);
      background: var(--white);
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      border: 1px solid var(--gray-300);
      border-radius: 24px;
      padding: 10px 18px;
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background: var(--gray-100);
    }

    .chat-input:focus { border-color: var(--terracotta); }

    .chat-input::placeholder { color: var(--gray-500); }

    .chat-send {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--terracotta);
      color: var(--white);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .chat-send:hover { background: #c0561f; }
    .chat-send:active { transform: scale(0.94); }
    .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }

    .chat-send svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ====== POWERED BY ====== */
    .powered-by {
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: var(--gray-500);
      background: var(--white);
      flex-shrink: 0;
    }

    .powered-by a {
      color: var(--terracotta);
      text-decoration: none;
      font-weight: 500;
    }

    /* ====== RESPONSIVE ====== */
    @media (min-width: 481px) {
      .chat-app {
        height: 95vh;
        margin: 2.5vh auto;
        border-radius: 20px;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <!-- Header -->
    <div class="chat-header">
      <div class="chat-avatar">ST</div>
      <div class="chat-header-info">
        <h1>Studio Tirra</h1>
        <div class="chat-header-status">
          <span class="status-dot"></span>
          Assistente Virtual
        </div>
      </div>
      <button class="btn-reset" onclick="resetSession()" title="Iniciar nova conversa">Nova conversa</button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="messages">
      <div class="typing-indicator" id="typing">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input-bar">
      <input
        type="text"
        class="chat-input"
        id="messageInput"
        placeholder="Digite sua mensagem..."
        autocomplete="off"
      >
      <button class="chat-send" id="sendBtn" aria-label="Enviar">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

    <!-- Powered by -->
    <div class="powered-by">
      Powered by <a href="#">Influence Labs</a>
    </div>
  </div>

  <script>
    // === CONFIG ===
    const WEBHOOK_PARAM = new URLSearchParams(window.location.search).get('webhook');
    const LOCAL_WEBHOOK_URL = 'http://localhost:3001/webhook/demo-chat';
    const DEFAULT_PROD_WEBHOOK_URL = 'https://studio-tirra-webchat-backend.onrender.com/webhook/demo-chat';
    const WEBHOOK_URL =
      WEBHOOK_PARAM ||
      localStorage.getItem('st_webhook_url') ||
      (window.location.hostname === 'localhost' ? LOCAL_WEBHOOK_URL : DEFAULT_PROD_WEBHOOK_URL);
    if (WEBHOOK_PARAM) localStorage.setItem('st_webhook_url', WEBHOOK_PARAM);

    // === STATE ===
    const sessionId = localStorage.getItem('st_session') || crypto.randomUUID();
    localStorage.setItem('st_session', sessionId);
    let sending = false;
    const conversationHistory = [];
    let lastMessage = '';

    // === DOM ===
    const messagesEl = document.getElementById('messages');
    const typingEl = document.getElementById('typing');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // === HELPERS ===
    function getTime() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = `msg msg-${type}`;
      div.innerHTML = text + `<span class="msg-time">${getTime()}</span>`;
      messagesEl.insertBefore(div, typingEl);
      scrollToBottom();
    }

    function showTyping() {
      typingEl.classList.add('active');
      scrollToBottom();
    }

    function hideTyping() {
      typingEl.classList.remove('active');
    }

    function setDisabled(disabled) {
      sending = disabled;
      sendBtn.disabled = disabled;
      inputEl.disabled = disabled;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // === SEND MESSAGE ===
    async function sendMessage(retryText) {
      const text = retryText || inputEl.value.trim();
      if (!text || sending) return;

      if (!retryText) {
        addMessage(text, 'sent');
        inputEl.value = '';
      }
      lastMessage = text;
      conversationHistory.push({ role: 'user', content: text });
      setDisabled(true);
      showTyping();

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 45000);

        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            session_id: sessionId,
            contact_name: 'Visitante',
            history: conversationHistory.slice(-20)
          }),
          signal: controller.signal
        });

        clearTimeout(timeout);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        hideTyping();
        const responses = Array.isArray(data.responses) && data.responses.length
          ? data.responses
          : [data.response || 'Desculpe, nao consegui processar. Tente novamente!'];
        const fullResponse = responses.join('\n\n');
        conversationHistory.push({ role: 'assistant', content: fullResponse });
        for (let i = 0; i < responses.length; i += 1) {
          addMessage(responses[i], 'received');
          if (i < responses.length - 1) await sleep(300);
        }
      } catch (err) {
        hideTyping();
        conversationHistory.pop(); // remove failed user message
        if (err.name === 'AbortError') {
          addMessage('Ops, demorou um pouco mais que o esperado. <a href="#" onclick="retrySend(event)">Tentar de novo?</a>', 'received');
        } else {
          addMessage('Estou com uma dificuldade tecnica no momento. Tente novamente em instantes!', 'received');
        }
      } finally {
        setDisabled(false);
        inputEl.focus();
      }
    }

    function retrySend(e) {
      if (e) e.preventDefault();
      if (lastMessage) sendMessage(lastMessage);
    }

    function resetSession() {
      localStorage.removeItem('st_session');
      localStorage.removeItem('st_webhook_url');
      location.reload();
    }

    // === EVENTS ===
    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // === INIT ===
    inputEl.focus();
  </script>
</body>
</html>
